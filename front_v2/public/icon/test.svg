<svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
	<style>
		/* Эффект рисования для спирали */
		.spiral {
			stroke-dasharray: 500;
			stroke-dashoffset: 500;
			animation: drawSpiral 3s infinite ease-out;
		}

		/* Эффект пульсации для зеленой точки */
		.pulse-group {
			transform-origin: 47.6px 47.6px;
			animation: pulse 2s infinite ease-in-out;
		}

		@keyframes drawSpiral {
			to {
				stroke-dashoffset: 0;
			}
		}

		@keyframes pulse {
			0% {
				transform: scale(1);
			}

			50% {
				transform: scale(1.15);
			}

			100% {
				transform: scale(1);
			}
		}
	</style>

	<circle cx="28" cy="28" r="28" fill="white" />

